  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070A12;

      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

    .card {

      max-width: 440px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);

    .header-bg {
      height: 110px;
      background: linear-gradient(135deg, #070A12 0%, #1e1b4b 50%, #0284c7 100%);

    }
    .avatar-wrapper {

    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;

    .content { padding: 1.5rem 2rem 2rem; text-align: center; }

    .bio {

      font-size: 0.85rem;
      color: #94A3B8;
      line-height: 1.5;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.825rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;

    .btn-whatsapp { background: #10B981; color: #042f2e; }

    .btn-email { background: #38BDF8; color: #070A12; }

    .btn-secondary {
      grid-column: span 2;
      background: #111B2B;
      color: #F8FAFC;
      border: 1px solid #253247;
    }
    .btn-secondary:hover { background: #162338; border-color: #38BDF8; }
    .links-grid {

      justify-content: center;
      gap: 1rem;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid #253247;
    }
    .social-link {
      color: #94A3B8;
      font-size: 0.8rem;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
