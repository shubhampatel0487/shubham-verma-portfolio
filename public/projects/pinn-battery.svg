<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="pinn-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-grad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Battery Hologram Outer Box -->
  <rect x="80" y="90" width="320" height="190" rx="20" stroke="#38BDF8" stroke-width="2.5" fill="#141C2A" fill-opacity="0.75" />
  <rect x="400" y="150" width="22" height="70" rx="6" fill="#38BDF8" opacity="0.8"/>
  
  <!-- Internal Cells & Charge Flow -->
  <rect x="110" y="120" width="55" height="130" rx="8" fill="#0E1726" stroke="#38BDF8" stroke-width="1.5" />
  <rect x="175" y="120" width="55" height="130" rx="8" fill="#0E1726" stroke="#38BDF8" stroke-width="1.5" />
  <rect x="240" y="120" width="55" height="130" rx="8" fill="#0E1726" stroke="#38BDF8" stroke-width="1.5" />
  <rect x="305" y="120" width="55" height="130" rx="8" fill="#0E1726" stroke="#8B5CF6" stroke-width="1.5" />

  <path d="M 120 220 L 155 150 L 140 150 L 150 130" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 185 220 L 220 150 L 205 150 L 215 130" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 250 220 L 285 150 L 270 150 L 280 130" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Neural Network + Differential Constraints Graph -->
  <g transform="translate(460, 80)">
    <rect width="280" height="230" rx="14" fill="#0F172A" stroke="#263244" stroke-width="1.5"/>
    <text x="24" y="38" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1">PINN LOSS CONVERGENCE</text>
    
    <!-- Coordinate axes -->
    <line x1="30" y1="180" x2="250" y2="180" stroke="#334155" stroke-width="1"/>
    <line x1="30" y1="50" x2="30" y2="180" stroke="#334155" stroke-width="1"/>

    <!-- Loss curves -->
    <path d="M 30 70 Q 80 150, 140 165 T 250 172" stroke="#8B5CF6" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
    <path d="M 30 90 Q 70 140, 130 155 T 250 174" stroke="#38BDF8" stroke-width="2.5" fill="none"/>

    <circle cx="250" cy="174" r="4" fill="#38BDF8"/>
    <text x="140" y="125" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="10">L_total = L_data + λ·L_phys</text>
  </g>

  <!-- Bottom Data Bar -->
  <rect x="80" y="320" width="660" height="70" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.2"/>
  <text x="110" y="350" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="16">BATTERY DIGITAL TWIN — STATE OF CHARGE / HEALTH (SoC/SoH)</text>
  <text x="110" y="372" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="12">ESTIMATION ERROR: &lt; 1.2% | PHYSICS-CONSTRAINED LOSS INTEGRATION</text>
  <circle cx="700" cy="355" r="7" fill="#10B981" />
  <circle cx="700" cy="355" r="14" stroke="#10B981" stroke-width="1" opacity="0.4"/>
</svg>

