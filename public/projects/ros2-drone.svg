<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="drone-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid-drone" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="#080B12"/>
  <rect width="800" height="450" fill="url(#grid-drone)"/>

  <!-- Drone Quadcopter Diagram -->
  <g transform="translate(180, 160)">
    <!-- Diagonal Arms -->
    <line x1="-80" y1="-70" x2="80" y2="70" stroke="#384860" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="70" x2="80" y2="-70" stroke="#384860" stroke-width="6" stroke-linecap="round"/>

    <!-- Central Body Core -->
    <rect x="-35" y="-35" width="70" height="70" rx="14" fill="#141C2A" stroke="url(#drone-glow)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#0E1626" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#38BDF8"/>

    <!-- Motors and Rotors -->
    <!-- Top-Left Rotor -->
    <circle cx="-80" cy="-70" r="30" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
    <circle cx="-80" cy="-70" r="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>

    <!-- Top-Right Rotor -->
    <circle cx="80" cy="-70" r="30" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
    <circle cx="80" cy="-70" r="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>

    <!-- Bottom-Left Rotor -->
    <circle cx="-80" cy="70" r="30" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
    <circle cx="-80" cy="70" r="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>

    <!-- Bottom-Right Rotor -->
    <circle cx="80" cy="70" r="30" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
    <circle cx="80" cy="70" r="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>

    <!-- Heading Arrow -->
    <path d="M 0 -35 L 0 -55 M -8 -45 L 0 -55 L 8 -45" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right side: ROS 2 & Gazebo Status -->
  <g transform="translate(450, 60)">
    <rect width="280" height="80" rx="10" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="28" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">ROS 2 DDS MIDDLEWARE</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="15">/px4_sitl/vehicle_odometry</text>
    <text x="20" y="70" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="10">Publishing at 100Hz | QoS: Reliable</text>

    <rect y="95" width="280" height="80" rx="10" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="123" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">GAZEBO PHYSICS ENGINE</text>
    <text x="20" y="147" fill="#38BDF8" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="15">SITL Real-time Factor: 1.00</text>
    <text x="20" y="165" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">Aerodynamics &amp; Rotor Drag Active</text>

    <rect y="190" width="280" height="80" rx="10" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="218" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">RVIZ 3D TELEMETRY</text>
    <text x="20" y="242" fill="#8B5CF6" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="15">TF Tree: base_link → camera_link</text>
    <text x="20" y="260" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">Point Cloud &amp; Waypoint Coordinates</text>
  </g>

  <!-- Title Footer -->
  <text x="60" y="365" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="22">ROS 2 &amp; DRONE SIMULATION</text>
  <text x="60" y="390" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14">Software-in-the-loop autonomous aerial kinematics, Gazebo physics &amp; RViz visualization</text>
</svg>
