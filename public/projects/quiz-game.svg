<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="quiz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid-qg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="#080B12"/>
  <rect width="800" height="450" fill="url(#grid-qg)"/>

  <!-- Quiz Interface Window -->
  <g transform="translate(100, 75)">
    <rect width="300" height="250" rx="14" fill="#0F172A" stroke="#263244" stroke-width="2"/>
    <rect width="300" height="34" rx="14" fill="#141C2A"/>
    <circle cx="20" cy="17" r="4" fill="#EF4444"/>
    <circle cx="34" cy="17" r="4" fill="#F59E0B"/>
    <circle cx="48" cy="17" r="4" fill="#10B981"/>
    <text x="150" y="22" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">quiz_app.py — Python 3</text>

    <!-- Question Box -->
    <rect x="20" y="55" width="260" height="50" rx="8" fill="#141C2A" stroke="#38BDF8" stroke-width="1"/>
    <text x="35" y="78" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600">Q3: Which protocol is used by ROS 2?</text>
    <text x="35" y="94" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">Score: 2/2 | Streak: +2</text>

    <!-- Options -->
    <rect x="20" y="118" width="260" height="28" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <text x="35" y="136" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="10">A) DDS (Data Distribution Service) ✓</text>

    <rect x="20" y="154" width="260" height="28" rx="6" fill="#141C2A" stroke="#263244" stroke-width="1"/>
    <text x="35" y="172" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">B) HTTP/1.1 Polling</text>

    <rect x="20" y="190" width="260" height="28" rx="6" fill="#141C2A" stroke="#263244" stroke-width="1"/>
    <text x="35" y="208" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">C) Telnet Raw Socket</text>
  </g>

  <!-- Right side: Program Features -->
  <g transform="translate(440, 80)">
    <rect width="280" height="75" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="28" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">PROGRAMMING ARCHITECTURE</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="16">Modular Object Logic</text>

    <rect y="90" width="280" height="75" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="118" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">VALIDATION &amp; SCORE ENGINE</text>
    <text x="20" y="142" fill="#38BDF8" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="16">Real-Time Score Metrics</text>

    <rect y="180" width="280" height="75" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="208" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">LEARNING OUTCOME</text>
    <text x="20" y="232" fill="#10B981" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="16">Python Control Flow Mastery</text>
  </g>

  <!-- Title Footer -->
  <text x="80" y="380" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="22">PYTHON QUIZ GAME APPLICATION</text>
  <text x="80" y="405" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14">Automated question handling, dynamic scoring logic &amp; command-line user experience</text>
</svg>
