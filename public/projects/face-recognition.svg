<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="face-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid-fr" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="#080B12"/>
  <rect width="800" height="450" fill="url(#grid-fr)"/>

  <!-- Face Detection Bounding Box & Landmarks -->
  <g transform="translate(120, 80)">
    <!-- Outer Camera Viewport -->
    <rect width="260" height="260" rx="16" fill="#141C2A" stroke="#263244" stroke-width="2"/>
    
    <!-- Target Bounding Box -->
    <path d="M 50 70 H 80 M 50 70 V 100" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 210 70 H 180 M 210 70 V 100" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 50 210 H 80 M 50 210 V 180" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 210 210 H 180 M 210 210 V 180" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

    <!-- Face Silhouette / Mesh Points -->
    <ellipse cx="130" cy="140" rx="45" ry="55" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 3" fill="#0A0E18"/>
    <circle cx="115" cy="125" r="3" fill="#38BDF8"/>
    <circle cx="145" cy="125" r="3" fill="#38BDF8"/>
    <circle cx="130" cy="142" r="2.5" fill="#10B981"/>
    <path d="M 120 165 Q 130 175, 140 165" stroke="#38BDF8" stroke-width="2" fill="none"/>

    <!-- Tag -->
    <rect x="50" y="40" width="130" height="24" rx="6" fill="#0284C7"/>
    <text x="60" y="56" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">STUDENT #104: MATCH 98%</text>
  </g>

  <!-- Right side: Attendance Logging Pipeline -->
  <g transform="translate(430, 80)">
    <rect width="290" height="75" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="28" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">OPENCV REAL-TIME INFERENCE</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="16">Automated Identity Logging</text>

    <rect y="90" width="290" height="75" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="118" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">FLASK BACKEND &amp; SQLITE</text>
    <text x="20" y="142" fill="#38BDF8" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="16">Timestamped Attendance DB</text>

    <rect y="180" width="290" height="75" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="208" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">VERIFICATION STATUS</text>
    <text x="20" y="232" fill="#10B981" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="16">Present • Logged at 09:14 AM</text>
  </g>

  <!-- Title Footer -->
  <text x="80" y="380" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="22">AI FACE RECOGNITION ATTENDANCE SYSTEM</text>
  <text x="80" y="405" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14">OpenCV computer vision pipeline, Flask REST API &amp; SQLite attendance tracking</text>
</svg>
