<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="safety-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <pattern id="grid-ad" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="#080B12"/>
  <rect width="800" height="450" fill="url(#grid-ad)"/>

  <!-- MQ-3 Sensor & Relay Control Schematic -->
  <g transform="translate(100, 75)">
    <!-- Circuit PCB Board -->
    <rect width="280" height="250" rx="14" fill="#0F172A" stroke="#263244" stroke-width="2"/>
    
    <!-- MQ-3 Sensor Cylinder -->
    <circle cx="90" cy="120" r="50" fill="#141C2A" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="90" cy="120" r="32" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="90" y="125" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">MQ-3 GAS</text>

    <!-- Signal Arrow -->
    <path d="M 150 120 H 190 M 180 110 L 195 120 L 180 130" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

    <!-- ESP32 MCU Node -->
    <rect x="200" y="70" width="60" height="100" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="230" y="120" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" transform="rotate(-90 230 120)">ESP32 MCU</text>

    <!-- Threshold Alert -->
    <rect x="30" y="195" width="220" height="36" rx="8" fill="#141C2A" stroke="#EF4444" stroke-width="1.5"/>
    <circle cx="50" cy="213" r="5" fill="#EF4444"/>
    <text x="65" y="217" fill="#F87171" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">THRESHOLD &gt; 0.05mg/L: IGNITION OFF</text>
  </g>

  <!-- Right side: Logic Interlock Engine -->
  <g transform="translate(430, 80)">
    <rect width="290" height="75" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="28" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">SENSOR SAMPLING FREQUENCY</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="16">10Hz Continuous Polling</text>

    <rect y="90" width="290" height="75" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="118" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">VEHICLE IGNITION INTERLOCK</text>
    <text x="20" y="142" fill="#10B981" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="16">Relay Safety Disconnect</text>

    <rect y="180" width="290" height="75" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="208" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">REAL-WORLD IMPACT</text>
    <text x="20" y="232" fill="#38BDF8" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="16">Drunk Driving Prevention</text>
  </g>

  <!-- Title Footer -->
  <text x="80" y="380" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="22">ESP32 ALCOHOL DETECTION SAFETY SYSTEM</text>
  <text x="80" y="405" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14">Embedded gas sensor calibration, threshold alarms &amp; automotive ignition control</text>
</svg>
