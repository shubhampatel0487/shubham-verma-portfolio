<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="grid-iot" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="#080B12"/>
  <rect width="800" height="450" fill="url(#grid-iot)"/>

  <!-- Microcontroller Chip Vector -->
  <g transform="translate(100, 80)">
    <!-- Circuit traces -->
    <path d="M 60 120 H 120" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
    <path d="M 60 140 H 120" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
    <path d="M 60 160 H 120" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
    <path d="M 280 120 H 340" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
    <path d="M 280 140 H 340" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
    <path d="M 280 160 H 340" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>

    <!-- ESP32 / Arduino Chip -->
    <rect x="120" y="60" width="160" height="170" rx="16" fill="#141C2A" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="140" y="80" width="120" height="70" rx="6" fill="#080B12" stroke="#263244" stroke-width="1.5"/>
    <text x="200" y="115" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" text-anchor="middle">ESP32 / MCU</text>
    <text x="200" y="135" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">DUAL CORE 240MHz</text>

    <!-- Pin Headers -->
    <circle cx="140" cy="180" r="4" fill="#F59E0B"/>
    <circle cx="160" cy="180" r="4" fill="#10B981"/>
    <circle cx="180" cy="180" r="4" fill="#38BDF8"/>
    <circle cx="200" cy="180" r="4" fill="#8B5CF6"/>
    <circle cx="220" cy="180" r="4" fill="#38BDF8"/>
    <circle cx="240" cy="180" r="4" fill="#10B981"/>
    <text x="200" y="210" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">GPIO / I2C / SPI / ADC</text>
  </g>

  <!-- Right Side Sensor Telemetry Data -->
  <g transform="translate(470, 70)">
    <rect width="260" height="110" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">MPU6050 6-AXIS IMU</text>
    <text x="20" y="62" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="18">Pitch: +2.4° | Roll: -0.8°</text>
    <text x="20" y="90" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="11">ACCEL: [0.02, -0.01, 0.98]g</text>

    <rect y="130" width="260" height="110" rx="12" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="20" y="162" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">WIFI TELEMETRY BUS</text>
    <text x="20" y="192" fill="#10B981" font-family="Space Grotesk, sans-serif" font-weight="600" font-size="18">MQTT / WebSockets 50Hz</text>
    <text x="20" y="220" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">Packet Loss: 0.00%</text>
  </g>

  <!-- Title Footer -->
  <text x="100" y="355" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="22">ROBOTICS &amp; EMBEDDED IoT EXPERIMENTS</text>
  <text x="100" y="380" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14">Hardware prototyping with Arduino, ESP32, multi-sensor telemetry &amp; actuator control</text>
</svg>
