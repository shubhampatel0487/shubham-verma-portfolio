<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="eval-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid-ac" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="#080B12"/>
  <rect width="800" height="450" fill="url(#grid-ac)"/>

  <!-- Document & Workflow Graphic -->
  <g transform="translate(80, 70)">
    <!-- Main document -->
    <rect width="260" height="300" rx="14" fill="#141C2A" stroke="#263244" stroke-width="2"/>
    <path d="M 190 0 L 260 70 L 190 70 Z" fill="#202D42"/>
    <rect x="30" y="40" width="120" height="12" rx="4" fill="#38BDF8" opacity="0.8"/>
    <rect x="30" y="70" width="180" height="8" rx="3" fill="#334155"/>
    <rect x="30" y="90" width="150" height="8" rx="3" fill="#334155"/>
    <rect x="30" y="110" width="190" height="8" rx="3" fill="#334155"/>

    <!-- Grade Stamp -->
    <circle cx="130" cy="210" r="50" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4" fill="#0F172A"/>
    <text x="130" y="215" fill="#10B981" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="24" text-anchor="middle">A+ (94%)</text>
    <text x="130" y="235" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">AUTOMATED EVAL</text>
  </g>

  <!-- Right side: Student/Teacher Flow -->
  <g transform="translate(390, 80)">
    <rect width="330" height="65" rx="10" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="24" y="28" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">ROLE-BASED WORKFLOW</text>
    <text x="24" y="50" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="600">Faculty Rubric &amp; Student Submissions</text>

    <rect y="85" width="330" height="65" rx="10" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="24" y="113" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">PDF ENGINE PIPELINE</text>
    <text x="24" y="135" fill="#38BDF8" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="600">Automated Grade Reports &amp; Analytics</text>

    <rect y="170" width="330" height="65" rx="10" fill="#141C2A" stroke="#263244" stroke-width="1.5"/>
    <text x="24" y="198" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">DATABASE STRUCTURE</text>
    <text x="24" y="220" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="600">SQLite / PostgreSQL Relational Schema</text>
  </g>

  <!-- Title Footer -->
  <text x="390" y="325" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="22">ASSIGNMENT EVALUATION SYSTEM</text>
  <text x="390" y="350" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14">End-to-end academic portal, submission archival &amp; session security</text>
</svg>
